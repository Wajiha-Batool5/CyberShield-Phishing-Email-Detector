<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL Phishing Detector</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

  <div class="page-wrapper">
    <div class="card" id="main-card">

      <div class="header">
        <div class="shield-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/>
            <path d="M21 21l-4.35-4.35"/>
          </svg>
        </div>
        <div>
          <h1>URL detector</h1>
          <p class="subtitle">// scan URLs for malicious patterns and security threats</p>
        </div>
      </div>

      {% if error %}
        <div class="error-box">
          {{ error }}
        </div>
      {% endif %}

      <form action="/predict_url" method="POST" id="scan-form">
        <p class="field-label">Enter URL</p>
        <div class="input-wrap">
          <input
            type="text"
            name="url"
            id="url-input"
            placeholder="https://example.com or example.com"
            required
          />
          <span class="char-count" id="char-count">0 chars</span>
        </div>

        <div class="form-row">
          <button type="button" class="btn" onclick="clearForm()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"/>
              <path d="M19 6l-1 14H6L5 6"/>
              <path d="M10 11v6M14 11v6"/>
            </svg>
            Clear
          </button>
          <button type="submit" class="btn btn-primary" id="submit-btn">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2.2"
                 stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"/>
              <path d="M21 21l-4.35-4.35"/>
            </svg>
            Analyse URL
          </button>
        </div>
      </form>

      <div class="info-box">
        <p><strong>ℹ️ Safe to use:</strong> Your URL is never logged or shared. Analysis happens locally.</p>
      </div>

      <!-- Navigation buttons -->
      <div class="nav-buttons-row">
        <a href="/" class="nav-btn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.2"
               stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"/>
            <polyline points="12 19 5 12 12 5"/>
          </svg>
          Back to Home
        </a>
        <a href="/email" class="nav-btn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="4" width="20" height="16" rx="2"/>
            <path d="M22 4l-10 8L2 4"/>
          </svg>
          Check Email
        </a>
      </div>

    </div>

    <p class="footer-note">
      <span class="footer-dot"></span>
      Your URL is never stored or shared
    </p>
  </div>

  <script>
    const input = document.getElementById('url-input');
    const counter = document.getElementById('char-count');
    const btn = document.getElementById('submit-btn');
    const form = document.getElementById('scan-form');
    const card = document.getElementById('main-card');

    input.addEventListener('input', () => {
      const len = input.value.length;
      counter.textContent = len.toLocaleString() + ' chars';
    });

    form.addEventListener('submit', (e) => {
      if (!input.value.trim()) {
        e.preventDefault();
        alert('Please enter a URL');
        return;
      }
      btn.disabled = true;
      btn.innerHTML = `
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"
             style="animation: spin 0.8s linear infinite">
          <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
        </svg>
        Scanning…
      `;
      card.classList.add('scanning-state');
    });

    function clearForm() {
      input.value = '';
      counter.textContent = '0 chars';
      input.focus();
    }
  </script>

  <style>
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .input-wrap {
      position: relative;
      margin-bottom: 20px;
    }

    .input-wrap input {
      width: 100%;
      padding: 12px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-primary);
      font-family: var(--mono);
      font-size: 14px;
      transition: border-color 0.2s, background 0.2s;
    }

    .input-wrap input:focus {
      outline: none;
      border-color: var(--amber);
      background: var(--surface-hover);
    }

    .input-wrap input::placeholder {
      color: var(--text-tertiary);
    }

    .info-box {
      background: var(--surface-hover);
      border-left: 3px solid var(--amber);
      padding: 12px 16px;
      border-radius: 4px;
      font-size: 13px;
      color: var(--text-secondary);
      margin: 20px 0;
    }

    .error-box {
      background: var(--red-dim);
      border: 1px solid var(--red);
      color: var(--red);
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
    }

    .nav-buttons-row {
      display: flex;
      gap: 12px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .nav-btn {
      flex: 1;
      min-width: 120px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 16px;
      background: var(--surface-hover);
      color: var(--text-secondary);
      border: 1px solid var(--border);
      text-decoration: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.2s;
    }

    .nav-btn:hover {
      border-color: var(--amber);
      color: var(--amber);
      background: var(--surface);
    }

    @media (max-width: 768px) {
      .nav-buttons-row {
        flex-direction: column;
      }

      .nav-btn {
        width: 100%;
      }
    }
  </style>

</body>
</html>
